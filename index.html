<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; connect-src 'none'">
<title>Flashcards</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,sans-serif;background:#111;color:#eee;padding:calc(env(safe-area-inset-top) + 8px) 12px 20px}
button,select,textarea{font:inherit;color:inherit;background:#222;border:1px solid #444;border-radius:8px;padding:10px}
button:active{background:#333}
.row{display:flex;gap:8px;margin:10px 0}
.row>*{flex:1}
#topbar{display:flex;gap:8px;align-items:center}
#menuBtn{flex:0 0 auto;width:46px;font-size:20px;padding:8px}
#deckSel{flex:1}
#card{min-height:45vh;background:#1c1c1e;border-radius:14px;padding:16px;display:flex;align-items:center;justify-content:center;margin:10px 0;overflow:auto;cursor:pointer}
#card.back{background:#16263a}
#cardText{margin:0;white-space:pre-wrap;word-break:break-word;font:15px/1.4 Menlo,monospace;text-align:center;width:100%}
textarea{width:100%;font-family:Menlo,monospace;font-size:14px;margin-bottom:8px}
#front,#back{min-height:70px}
#jsonBox{min-height:55vh}
.hidden{display:none}
#list div{display:flex;gap:8px;align-items:center;border-bottom:1px solid #333;padding:6px 0}
#list pre{flex:1;font-size:12px;max-height:60px;overflow:hidden;margin:0;white-space:pre-wrap}
#count{text-align:center;color:#888}
/* hamburger menu */
#menuOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10}
#menu{position:absolute;top:0;left:0;height:100%;width:75%;max-width:280px;background:#1c1c1e;padding:calc(env(safe-area-inset-top) + 16px) 14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:2px 0 12px #000}
#menu button{width:100%;text-align:left}
#menu h3{margin:4px 0 2px;color:#888;font-size:13px;font-weight:normal}
.jerr{color:#ff8080;font-size:13px;min-height:16px}
</style>
</head>
<body>
<div id="topbar">
  <button id="menuBtn">☰</button>
  <select id="deckSel"></select>
</div>
<div class="row">
  <button id="tabStudy">Study</button>
  <button id="tabEdit">Edit</button>
</div>

<!-- STUDY -->
<section id="study">
  <div id="card"><pre id="cardText"></pre></div>
  <div id="count"></div>
  <div class="row">
    <button id="prev">◀</button>
    <button id="shuffle">Shuffle</button>
    <button id="next">▶</button>
  </div>
</section>

<!-- EDIT -->
<section id="edit" class="hidden">
  <textarea id="front" placeholder="Front (e.g. syntax)"></textarea>
  <textarea id="back" placeholder="Back (e.g. meaning)"></textarea>
  <button id="add" style="width:100%">Add card</button>
  <div id="list"></div>
</section>

<!-- JSON EDITOR -->
<section id="jsonEdit" class="hidden">
  <h3 style="color:#888;margin:6px 0">Editing deck as JSON — paste a cards array <em>[{"f":"..","b":".."}]</em> or a full backup object.</h3>
  <div id="jsonErr" class="jerr"></div>
  <textarea id="jsonBox" spellcheck="false"></textarea>
  <div class="row">
    <button id="jsonCancel">Cancel</button>
    <button id="jsonSave">Save</button>
  </div>
</section>

<!-- HAMBURGER MENU -->
<div id="menuOverlay" class="hidden">
  <div id="menu">
    <h3>Deck</h3>
    <button id="mNewDeck">+ Add Deck</button>
    <button id="mJson">Open as .json</button>
    <button id="mDelDeck">Delete Deck</button>
    <h3>Backup</h3>
    <button id="mExport">Export backup file</button>
    <button id="mImport">Import backup file</button>
    <input type="file" id="importFile" accept=".json,application/json" class="hidden">
    <div style="flex:1"></div>
    <button id="mClose">Close</button>
  </div>
</div>

<script>
const KEY='flashcards_v1';
const $=id=>document.getElementById(id);
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{decks:{'Default':[]},current:'Default'};
let order=[],pos=0,flipped=false;

const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const cards=()=>data.decks[data.current]||[];

function renderDecks(){
  $('deckSel').innerHTML='';
  for(const name of Object.keys(data.decks)){
    const o=document.createElement('option');o.value=o.textContent=name;
    if(name===data.current)o.selected=true;
    $('deckSel').appendChild(o);
  }
}
function resetOrder(){order=cards().map((_,i)=>i);pos=0;flipped=false;}
function renderCard(){
  const c=cards();
  if(!c.length){$('cardText').textContent='No cards. Add some in Edit.';$('count').textContent='';$('card').className='';return;}
  const card=c[order[pos]];
  $('cardText').textContent=flipped?card.b:card.f;
  $('card').className=flipped?'back':'';
  $('count').textContent=`${pos+1} / ${c.length}`;
}
function renderList(){
  $('list').innerHTML='';
  cards().forEach((card,i)=>{
    const row=document.createElement('div');
    const p=document.createElement('pre');p.textContent=card.f+'\n→ '+card.b;
    const del=document.createElement('button');del.textContent='✕';del.style.flex='0 0 auto';
    del.onclick=()=>{cards().splice(i,1);save();resetOrder();renderList();renderCard();};
    row.append(p,del);$('list').appendChild(row);
  });
}
function refresh(){renderDecks();resetOrder();renderCard();renderList();}

// Tabs
function showTab(name){
  $('study').classList.toggle('hidden',name!=='study');
  $('edit').classList.toggle('hidden',name!=='edit');
  $('jsonEdit').classList.toggle('hidden',name!=='json');
}
$('tabStudy').onclick=()=>showTab('study');
$('tabEdit').onclick=()=>showTab('edit');

// Study controls
$('card').onclick=()=>{if(cards().length){flipped=!flipped;renderCard();}};
$('next').onclick=()=>{const n=cards().length;if(n){pos=(pos+1)%n;flipped=false;renderCard();}};
$('prev').onclick=()=>{const n=cards().length;if(n){pos=(pos-1+n)%n;flipped=false;renderCard();}};
$('shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}pos=0;flipped=false;renderCard();};

// Deck select
$('deckSel').onchange=e=>{data.current=e.target.value;save();refresh();showTab('study');};

// Add card
$('add').onclick=()=>{const f=$('front').value,b=$('back').value;if(!f.trim()||!b.trim())return;cards().push({f,b});save();$('front').value=$('back').value='';resetOrder();renderList();renderCard();$('front').focus();};

// ---- Hamburger menu ----
const openMenu=()=>$('menuOverlay').classList.remove('hidden');
const closeMenu=()=>$('menuOverlay').classList.add('hidden');
$('menuBtn').onclick=openMenu;
$('mClose').onclick=closeMenu;
$('menuOverlay').onclick=e=>{if(e.target.id==='menuOverlay')closeMenu();};

$('mNewDeck').onclick=()=>{closeMenu();const n=prompt('Deck name?');if(n&&!data.decks[n]){data.decks[n]=[];data.current=n;save();refresh();showTab('study');}};
$('mDelDeck').onclick=()=>{closeMenu();if(Object.keys(data.decks).length<2)return alert('Keep at least one deck');if(confirm(`Delete "${data.current}"?`)){delete data.decks[data.current];data.current=Object.keys(data.decks)[0];save();refresh();}};

// Open as .json — edit current deck inline
$('mJson').onclick=()=>{closeMenu();$('jsonErr').textContent='';$('jsonBox').value=JSON.stringify(cards(),null,2);showTab('json');};
$('jsonCancel').onclick=()=>showTab('study');
$('jsonSave').onclick=()=>{
  let parsed;
  try{parsed=JSON.parse($('jsonBox').value);}catch(e){$('jsonErr').textContent='Invalid JSON: '+e.message;return;}
  if(Array.isArray(parsed)){
    if(!parsed.every(c=>c&&typeof c.f==='string'&&typeof c.b==='string')){$('jsonErr').textContent='Each card needs string "f" and "b".';return;}
    data.decks[data.current]=parsed;
  }else if(parsed&&parsed.decks){
    data=parsed;if(!data.decks[data.current])data.current=Object.keys(data.decks)[0];
  }else{$('jsonErr').textContent='Expected a cards array or a {decks,current} object.';return;}
  save();refresh();showTab('study');
};

// Backup export / import
$('mExport').onclick=()=>{closeMenu();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='flashcards-backup.json';a.click();};
$('mImport').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!d.decks)throw 0;if(confirm('Replace all decks with backup?')){data=d;if(!data.decks[data.current])data.current=Object.keys(data.decks)[0];save();refresh();closeMenu();}}catch{alert('Invalid backup file');}e.target.value='';};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
refresh();
showTab('study');
</script>
</body>
</html>
